<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>body{margin:0}img{max-width:100%}</style></head><body><title>Be Temple Bares</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: una columna de bolsillo con la estética oscura de las placas de Temple (fondo carbón, títulos en verde agua y magenta). Sin fuentes externas para que cargue rápido en cualquier celular. */
:root{
  --bg:#231F20; --surface:#2E2A2B; --line:#433D3E; --ink:#F4F1EE; --muted:#B9B1AD;
  --teal:#2BB3A0; --pink:#E8357F; --yellow:#F2C230; --bad:#FF8A7A;
  --display:"Arial Black","Helvetica Neue",Arial,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
h1{font-family:var(--display);font-size:1.7rem;letter-spacing:.01em;text-transform:uppercase}
h1 em{font-style:normal;color:var(--teal)}
h2{font-family:var(--display);font-size:1.35rem;text-transform:uppercase;color:var(--teal);letter-spacing:.01em}
h3{font-size:1.05rem;font-weight:700;color:var(--pink);text-transform:uppercase;letter-spacing:.03em}
p{margin:0}
strong{color:var(--teal)}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lead{color:var(--muted);margin-top:4px}
.muted{color:var(--muted);font-size:.9rem;margin-top:2px}
.mb{margin-bottom:10px}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel > h3{margin-bottom:8px}
/* Puerta */
.gate{margin-top:28px;display:flex;flex-direction:column;gap:14px}
.gate h2{color:var(--ink)}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
input{width:100%;font:inherit;font-size:1.1rem;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);letter-spacing:.04em}
input:focus{border-color:var(--teal);outline:none}
.btn{font:inherit;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border:0;border-radius:10px;padding:13px 18px;cursor:pointer;background:var(--teal);color:#10201D;width:100%}
.btn:disabled{opacity:.6}
.btn.link{background:none;color:var(--muted);text-transform:none;font-weight:600;width:auto;padding:6px 0;text-decoration:underline}
button:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.err{color:var(--bad);font-size:.92rem;min-height:1.4em}
/* Navegación */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:18px 0 6px;padding-block:8px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tab{flex:0 0 auto;font:inherit;font-size:.88rem;font-weight:700;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.tab[aria-current="true"]{background:var(--teal);border-color:var(--teal);color:#10201D}
.section > h2{margin-top:8px}
.section > .lead{margin-bottom:16px}
/* Pasos */
.steps{margin:4px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;position:relative;padding-left:40px;min-height:30px}
.steps li::before{content:counter(s) "°";position:absolute;left:0;top:-2px;font-family:var(--display);font-size:1.15rem;color:var(--teal)}
.steps b{color:var(--ink)}
ul.plain{margin:8px 0 0;padding-left:20px}
ul.plain li{margin:5px 0}
ul.checks{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.checks li{padding-left:30px;position:relative}
ul.checks li::before{content:"✓";position:absolute;left:0;top:0;color:var(--teal);font-weight:900;font-size:1.1rem}
/* Tarjetas de licencias / apercibimientos */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.lic{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.lic-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.lic-h b{text-transform:uppercase;font-size:.95rem;letter-spacing:.02em}
.lic-h span{font-size:.8rem;font-weight:700;color:var(--yellow);white-space:nowrap}
.lic p{color:var(--muted);font-size:.93rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px}
.fact .big{font-family:var(--display);font-size:1.5rem;color:var(--yellow);text-transform:uppercase}
.fact span:last-child{color:var(--muted);font-size:.9rem}
.note{border-left:4px solid var(--pink);background:var(--surface);padding:12px 14px;border-radius:0 10px 10px 0;font-size:.95rem}
.pending{border:2px dashed var(--yellow);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;color:var(--muted)}
.pending strong{color:var(--yellow)}
.contact{display:flex;flex-direction:column;gap:2px}
.sel{user-select:all;-webkit-user-select:all;color:var(--teal);word-break:break-all}
h1,h2,.purpose p,.prin h3,.fact .big,.steps li::before{font-weight:900}
/* Cultura */
.purpose{background:var(--teal);color:#10201D;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px}
.purpose .eyebrow{color:#10201D;opacity:.8}
.purpose p{font-family:var(--display);font-size:1.25rem;line-height:1.25;text-transform:uppercase}
.prin{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--pc);border-radius:12px;padding:16px}
.prin h3{color:var(--pc);font-family:var(--display);font-size:1.4rem;letter-spacing:.01em}
.prin .tagline{font-weight:800;margin-top:6px}
.prin .intro{color:var(--muted);font-style:italic;margin-top:6px}
.prin dl,.tdl{margin:12px 0 0;display:flex;flex-direction:column;gap:2px}
.prin dt{font-weight:800;text-transform:uppercase;font-size:.85rem;letter-spacing:.05em;color:var(--pc);margin-top:8px}
.prin dd,.tdl dd{margin:0}
.tdl dt{font-weight:800;margin-top:8px}
.p-pink{--pc:var(--pink)} .p-teal{--pc:var(--teal)} .p-slate{--pc:#8FA3B3} .p-yellow{--pc:var(--yellow)}
.banner{margin-top:12px;background:var(--pink);color:#fff;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-radius:8px;text-align:center}
/* Beneficios */
.bens{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ben{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative;overflow:hidden}
.ben::after{content:"";position:absolute;right:-28px;top:-28px;width:96px;height:96px;border-radius:50%;background:var(--bc);opacity:.14}
.ben-top{display:flex;align-items:baseline;gap:6px}
.ben-big{font-family:var(--display);font-weight:900;font-size:2.4rem;line-height:1;color:var(--bc);text-transform:uppercase}
.ben-tag{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;color:var(--bc)}
.ben h3{color:var(--ink);font-size:1.15rem;text-transform:none;letter-spacing:0}
.ben b{color:var(--ink)}
.ben-how{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:.9rem;color:var(--muted);margin-top:auto}
.ben-how > span:first-child{display:block;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;color:var(--bc);margin-bottom:2px}
.ben-how a{color:var(--bc)}
.b-teal{--bc:var(--teal)} .b-pink{--bc:var(--pink)} .b-yellow{--bc:var(--yellow)} .b-slate{--bc:#8FA3B3}
/* Herramientas */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.tool{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:var(--ink);min-width:0}
.tool:active,.tool:hover{border-color:var(--teal)}
.tool-name{font-weight:800}
.tool-desc{color:var(--muted);font-size:.9rem}
.tool-go{margin-top:6px;font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--teal)}
.tool-go::after{content:" →"}
/* Inicio */
#home{display:flex;flex-direction:column;gap:22px;margin-top:20px}
.search input{font-size:1rem;letter-spacing:0;border-radius:999px;padding:12px 16px;background:var(--surface)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.group{display:flex;flex-direction:column;gap:10px}
.group h3{color:var(--bc);font-size:.8rem;letter-spacing:.12em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bc,var(--teal));border-radius:12px;padding:14px;text-decoration:none;color:var(--ink);min-width:0;min-height:88px}
.tile b{font-size:1rem;line-height:1.2}
.tile span{color:var(--muted);font-size:.85rem;line-height:1.3}
.tile:active,.tile:hover{background:var(--line)}
.b-enc{--bc:var(--yellow)}
.tile-enc{background:transparent;border:2px dashed var(--yellow)}
.enc-badge{display:inline-block;margin-top:10px;background:var(--yellow);color:#231F20;font-weight:900;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.back{display:inline-block;margin:16px 0 4px;color:var(--teal);font-weight:800;text-decoration:none;padding:6px 0}
#results .tiles{margin-top:4px}
#groups{display:flex;flex-direction:column;gap:22px}
.search input{font-weight:400}
.tile:only-child{grid-column:1/-1;min-height:0}
.hdr{display:flex;gap:14px;align-items:center}
.hdr > div{min-width:0}
.logo{width:56px;height:56px;flex:0 0 auto}
.cover{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-block:28px 4px}
.cover-logo{width:140px;height:140px;max-width:100%;margin-bottom:10px}
.cover h1{font-size:2.1rem}
.cover-tag{color:var(--muted);max-width:30ch}
@media (prefers-reduced-motion:no-preference){.cover-logo{animation:pop .6s ease-out}@keyframes pop{from{transform:scale(.85)}to{transform:none}}}
.foot{margin-top:36px;color:var(--muted);font-size:.85rem;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
</style>

var CONTENT = "\u003cdiv id=\"home\">\n  \u003clabel class=\"search\" for=\"q\">\u003cspan class=\"sr\">Buscar\u003c/span>\u003cinput id=\"q\" type=\"search\" placeholder=\"Buscar (ej: certificado)\" autocomplete=\"off\">\u003c/label>\n  \u003cdiv id=\"results\" hidden>\u003c/div>\n  \u003cdiv id=\"groups\">\n    \u003cdiv class=\"group b-teal\">\u003ch3>Nuestra cultura\u003c/h3>\u003cdiv class=\"tiles\">\u003ca class=\"tile\" href=\"#cultura\">\u003cb>Cultura Temple\u003c/b>\u003cspan>Propósito, principios, Templario y manifiesto\u003c/span>\u003c/a>\u003c/div>\u003c/div>\n    \u003cdiv class=\"group b-pink\">\u003ch3>Tus días\u003c/h3>\u003cdiv class=\"tiles\">\u003ca class=\"tile\" href=\"#vacaciones\">\u003cb>Vacaciones y licencias\u003c/b>\u003cspan>Cómo pedirlas y cuántos días tenés\u003c/span>\u003c/a>\u003ca class=\"tile\" href=\"#certificados\">\u003cb>Certificados\u003c/b>\u003cspan>Cómo y cuándo presentarlos\u003c/span>\u003c/a>\u003ca class=\"tile\" href=\"#presentismo\">\u003cb>Presentismo\u003c/b>\u003cspan>Cuándo lo cobrás\u003c/span>\u003c/a>\u003c/div>\u003c/div>\n    \u003cdiv class=\"group b-yellow\">\u003ch3>Tu sueldo\u003c/h3>\u003cdiv class=\"tiles\">\u003ca class=\"tile\" href=\"#adelantos\">\u003cb>Adelantos\u003c/b>\u003cspan>Cuándo y cómo pedir uno\u003c/span>\u003c/a>\u003ca class=\"tile\" href=\"#horas-extras\">\u003cb>Horas extras\u003c/b>\u003cspan>Quién las aprueba\u003c/span>\u003c/a>\u003c/div>\u003c/div>\n    \u003cdiv class=\"group b-slate\">\u003ch3>Reglas del equipo\u003c/h3>\u003cdiv class=\"tiles\">\u003ca class=\"tile\" href=\"#politicas\">\u003cb>Políticas\u003c/b>\u003cspan>Uniforme, puntualidad e ingreso\u003c/span>\u003c/a>\u003ca class=\"tile\" href=\"#apercibimientos\">\u003cb>Apercibimientos\u003c/b>\u003cspan>Motivos y suspensiones\u003c/span>\u003c/a>\u003c/div>\u003c/div>\n    \u003cdiv class=\"group b-teal\">\u003ch3>Para vos\u003c/h3>\u003cdiv class=\"tiles\">\u003ca class=\"tile\" href=\"#beneficios\">\u003cb>Beneficios\u003c/b>\u003cspan>Descuentos, cumpleaños, préstamo y más\u003c/span>\u003c/a>\u003ca class=\"tile\" href=\"#herramientas\">\u003cb>Caja de herramientas\u003c/b>\u003cspan>Todos los formularios\u003c/span>\u003c/a>\u003ca class=\"tile\" href=\"#contacto\">\u003cb>Contacto RRHH\u003c/b>\u003cspan>¿Dudas? Escribinos\u003c/span>\u003c/a>\u003c/div>\u003c/div>\n    \u003cdiv class=\"group b-enc\">\u003ch3>Solo para encargados\u003c/h3>\u003cdiv class=\"tiles\">\u003ca class=\"tile tile-enc\" href=\"#encargados\">\u003cb>Guía para encargados\u003c/b>\u003cspan>Ingresos, apercibimientos, adelantos y más\u003c/span>\u003c/a>\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003csection class=\"section\" data-sec=\"cultura\" data-label=\"Cultura Temple\" hidden>\n  \u003ch2>Temple se vive\u003c/h2>\n  \u003cp class=\"lead\">Nuestros principios culturales.\u003c/p>\n  \u003cdiv class=\"stack\">\n    \u003cdiv class=\"purpose\">\n      \u003cspan class=\"eyebrow\">Propósito · Nuestra razón de ser\u003c/span>\n      \u003cp>Crear marcas y experiencias que las personas elijan para disfrutar de sus mejores momentos.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"prin p-pink\">\n      \u003ch3>Pasión\u003c/h3>\n      \u003cp class=\"intro\">No somos un conjunto de estrellas, somos un equipo estelar. Unidos por la convicción de que lo extraordinario se construye con pasión y en equipo.\u003c/p>\n      \u003cdl>\n        \u003cdt>Intensidad\u003c/dt>\u003cdd>No paramos hasta conseguir lo que nos proponemos.\u003c/dd>\n        \u003cdt>Excelencia\u003c/dt>\u003cdd>Damos siempre lo mejor.\u003c/dd>\n        \u003cdt>Convicción\u003c/dt>\u003cdd>Creemos en lo que hacemos.\u003c/dd>\n        \u003cdt>Pertenencia\u003c/dt>\u003cdd>Somos parte de un equipo. Nos ponemos la camiseta.\u003c/dd>\n      \u003c/dl>\n    \u003c/div>\n\n    \u003cdiv class=\"prin p-teal\">\n      \u003ch3>Innovación\u003c/h3>\n      \u003cp class=\"tagline\">La innovación es nuestra bandera.\u003c/p>\n      \u003cp class=\"intro\">Nos animamos a romper esquemas, a cuestionar lo establecido y a transformar lo desconocido en oportunidades únicas. Nuestros procesos son herramientas al servicio de la optimización del trabajo, no son obstáculos de la innovación y la agilidad. Se adaptan a nuestra realidad.\u003c/p>\n      \u003cdl>\n        \u003cdt>Tomar riesgos\u003c/dt>\u003cdd>Preferimos pedir perdón y no permiso.\u003c/dd>\n        \u003cdt>Creatividad\u003c/dt>\u003cdd>Fomentamos ideas disruptivas que desafíen lo conocido.\u003c/dd>\n        \u003cdt>Agilidad\u003c/dt>\u003cdd>Actuamos rápido, somos flexibles, el cambio nos mueve.\u003c/dd>\n      \u003c/dl>\n    \u003c/div>\n\n    \u003cdiv class=\"prin p-slate\">\n      \u003ch3>Confianza\u003c/h3>\n      \u003cp class=\"tagline\">Confiamos en el poder de la autonomía en equipo.\u003c/p>\n      \u003cp class=\"intro\">Creamos un entorno donde hay libertad para opinar y tomar decisiones. Tratamos a los adultos como adultos.\u003c/p>\n      \u003cdl>\n        \u003cdt>Compromiso\u003c/dt>\u003cdd>Cada integrante actúa con criterio y responsabilidad, alineado a nuestros principios e impulsando el éxito colectivo.\u003c/dd>\n        \u003cdt>Cercanía\u003c/dt>\u003cdd>Comunicación abierta, sincera y constructiva como base para aprender, ajustar y mejorar.\u003c/dd>\n        \u003cdt>Autonomía\u003c/dt>\u003cdd>Decidir, resolver, proponer e impulsar, siempre con responsabilidad y mirada colectiva.\u003c/dd>\n      \u003c/dl>\n    \u003c/div>\n\n    \u003cdiv class=\"prin p-yellow\">\n      \u003ch3>Experiencia\u003c/h3>\n      \u003cp class=\"tagline\">La experiencia Temple se construye cada día.\u003c/p>\n      \u003cdl>\n        \u003cdt>Calidez humana\u003c/dt>\u003cdd>Respeto y empatía inquebrantables.\u003c/dd>\n        \u003cdt>Autenticidad\u003c/dt>\u003cdd>Nos mostramos como somos.\u003c/dd>\n        \u003cdt>Buena onda\u003c/dt>\u003cdd>Respeto, humor y calidez que no se fuerzan.\u003c/dd>\n        \u003cdt>Comunidad\u003c/dt>\u003cdd>Nos preocupamos por el otro y construimos juntos.\u003c/dd>\n        \u003cdt>Disfrutar el camino\u003c/dt>\u003cdd>Si no se disfruta, no es TEMPLE.\u003c/dd>\n        \u003cdt>Coherencia\u003c/dt>\u003cdd>Lo que decimos y hacemos está alineado.\u003c/dd>\n      \u003c/dl>\n    \u003c/div>\n\n    \u003cdiv class=\"panel\">\n      \u003ch3>Templario\u003c/h3>\n      \u003cp class=\"muted\" style=\"margin-bottom:10px\">Dícese de aquella persona que vibra con la cultura Temple, la vive, la transmite y la sostiene en cada acción.\u003c/p>\n      \u003cdl class=\"tdl\">\n        \u003cdt>No está solo:\u003c/dt>\u003cdd>sabe que el equipo es su lugar.\u003c/dd>\n        \u003cdt>No espera indicaciones:\u003c/dt>\u003cdd>propone, acciona, resuelve.\u003c/dd>\n        \u003cdt>No se conforma:\u003c/dt>\u003cdd>busca siempre hacer las cosas mejor.\u003c/dd>\n        \u003cdt>No actúa por cumplir:\u003c/dt>\u003cdd>lo hace porque cree en lo que construimos juntos.\u003c/dd>\n      \u003c/dl>\n      \u003cp style=\"margin-top:12px\">\u003cstrong>Ser Templario es una forma de ser y hacer.\u003c/strong>\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"panel\">\n      \u003ch3>Manifiesto\u003c/h3>\n      \u003cul class=\"plain\">\n        \u003cli>Trabajamos con pasión y compromiso.\u003c/li>\n        \u003cli>Nos une la búsqueda de la excelencia y el orgullo por lo que hacemos.\u003c/li>\n        \u003cli>Confiamos en las personas: damos autonomía, pedimos responsabilidad.\u003c/li>\n        \u003cli>Creemos en el poder de trabajar en equipo, con claridad y cercanía.\u003c/li>\n        \u003cli>La innovación nos mueve: pensamos distinto, actuamos rápido y aprendemos todo el tiempo.\u003c/li>\n        \u003cli>Creamos experiencias con autenticidad y buena onda.\u003c/li>\n        \u003cli>Nos apoyamos, disfrutamos el camino y cuidamos el vínculo.\u003c/li>\n        \u003cli>La cultura se demuestra en cada decisión.\u003c/li>\n      \u003c/ul>\n      \u003cp class=\"banner\">Somos Grupo Temple, nuestra cultura nos define.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" data-sec=\"politicas\" data-label=\"Políticas\" hidden>\n  \u003ch2>Políticas\u003c/h2>\n  \u003cp class=\"lead\">Las reglas básicas para trabajar bien y en equipo.\u003c/p>\n  \u003cdiv class=\"stack\">\n    \u003cdiv class=\"panel\">\n      \u003ch3>Uniforme\u003c/h3>\n      \u003cp>El uniforme es parte de la experiencia Temple: es lo primero que ve quien entra al bar. ¡Cuidalo como tuyo!\u003c/p>\n      \u003cul class=\"plain\">\n        \u003cli>\u003cb>Te lo damos cuando empezás\u003c/b> y firmás la política de uniformes.\u003c/li>\n        \u003cli>\u003cb>En salón, siempre con uniforme,\u003c/b> limpio y en buen estado.\u003c/li>\n        \u003cli>\u003cb>Si se pierde o se rompe,\u003c/b> avisale a tu encargado.\u003c/li>\n        \u003cli>\u003cb>Si algún día te vas,\u003c/b> lo devolvés cuando retirás tu liquidación.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\n      \u003ch3>Puntualidad\u003c/h3>\n      \u003cp>Hay una \u003cstrong>tolerancia máxima de 20 minutos\u003c/strong> sobre tu horario de ingreso. Después de eso corresponde un apercibimiento por llegada tarde.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\n      \u003ch3>Tus datos al día\u003c/h3>\n      \u003cp>Si te mudás, avisale a RRHH dentro de las \u003cstrong>24 hs hábiles\u003c/strong> y completá el formulario de actualización de domicilio.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\n      \u003ch3>Ingreso de personal nuevo\u003c/h3>\n      \u003cp class=\"muted\">¡Bienvenido/a a Temple! Esto es lo que necesitás para arrancar.\u003c/p>\n      \u003col class=\"steps\">\n        \u003cli>\u003cb>Mandale a tu encargado una foto de tu DNI,\u003c/b> de frente y de dorso.\u003c/li>\n        \u003cli>\u003cb>Completá y firmá tu documentación:\u003c/b> el legajo, el certificado de domicilio y la política de uniformes. Te la da tu encargado.\u003c/li>\n        \u003cli>\u003cb>Recibí tu uniforme.\u003c/b>\u003c/li>\n        \u003cli>\u003cb>Conocé la cultura Temple.\u003c/b> Leé la sección \"Cultura Temple\" de esta app.\u003c/li>\n      \u003c/ol>\n      \u003cdiv class=\"ben-how b-teal\" style=\"margin-top:14px\">\n        \u003cspan>Tené a mano para el legajo\u003c/span>\n        DNI y CUIL · domicilio (con entre calles), localidad y código postal · fecha de nacimiento · teléfono y mail · obra social · nombre y teléfono de un contacto de emergencia.\n      \u003c/div>\n      \u003cp class=\"muted\" style=\"margin-top:10px\">Tu encargado se ocupa de avisarle a RRHH y de sumarte a la planilla de horas.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" data-sec=\"vacaciones\" data-label=\"Vacaciones y licencias\" hidden>\n  \u003ch2>Vacaciones y licencias\u003c/h2>\n  \u003cp class=\"lead\">Cómo pedirlas y cuántos días te corresponden.\u003c/p>\n  \u003cdiv class=\"stack\">\n    \u003cdiv class=\"panel\">\n      \u003ch3>Cómo pedir vacaciones o una licencia\u003c/h3>\n      \u003col class=\"steps\">\n        \u003cli>\u003cb>Charlalo con tu gerente.\u003c/b> Para vacaciones, coordiná las fechas con tiempo. Para una licencia, avisale el día y el motivo.\u003c/li>\n        \u003cli>\u003cb>Pedí la planilla a RRHH.\u003c/b> Cuando tu gerente te diga que sí, pedile a Mariel la planilla de \"Solicitud de vacaciones\" o \"Solicitud de licencia\". Completala y firmala.\u003c/li>\n        \u003cli>\u003cb>Entregá la planilla\u003c/b> completa y firmada a Mariel.\u003c/li>\n        \u003cli>\u003cb>Avisá a tu equipo\u003c/b> con anticipación qué días no vas a estar.\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n    \u003cdiv>\n      \u003ch3 class=\"mb\">¿Qué licencias corresponden?\u003c/h3>\n      \u003cdiv class=\"cards\">\n        \u003cdiv class=\"lic\">\u003cdiv class=\"lic-h\">\u003cb>Estudio\u003c/b>\u003cspan>2 días corridos\u003c/span>\u003c/div>\u003cp>Máximo 10 por año. Pedila con 7 días de anticipación como mínimo.\u003c/p>\u003c/div>\n        \u003cdiv class=\"lic\">\u003cdiv class=\"lic-h\">\u003cb>Mudanza\u003c/b>\u003cspan>1 día\u003c/span>\u003c/div>\u003cp>Pedila con 7 días de anticipación como mínimo.\u003c/p>\u003c/div>\n        \u003cdiv class=\"lic\">\u003cdiv class=\"lic-h\">\u003cb>Cumpleaños\u003c/b>\u003cspan>1 día\u003c/span>\u003c/div>\u003cp>Se toma el día de tu cumpleaños. Pedila con 7 días de anticipación.\u003c/p>\u003c/div>\n        \u003cdiv class=\"lic\">\u003cdiv class=\"lic-h\">\u003cb>Maternidad\u003c/b>\u003cspan>Hasta 180 días\u003c/span>\u003c/div>\u003cp>90 días pagos. Del día 90 al 180, sin goce de sueldo. Se pide cuando tu médico indica la fecha probable de parto, con el certificado. Empieza al menos 30 días antes de esa fecha.\u003c/p>\u003c/div>\n        \u003cdiv class=\"lic\">\u003cdiv class=\"lic-h\">\u003cb>Paternidad\u003c/b>\u003cspan>15 días\u003c/span>\u003c/div>\u003cp>Empieza el día del nacimiento. Avisá antes la fecha estimada de parto.\u003c/p>\u003c/div>\n        \u003cdiv class=\"lic\">\u003cdiv class=\"lic-h\">\u003cb>Enfermedad\u003c/b>\u003cspan>Según certificado\u003c/span>\u003c/div>\u003cp>Podés pedirla el mismo día. Tenés que presentar certificado médico.\u003c/p>\u003c/div>\n        \u003cdiv class=\"lic\">\u003cdiv class=\"lic-h\">\u003cb>Enfermedad de familiar directo\u003c/b>\u003cspan>1 día al año\u003c/span>\u003c/div>\u003cp>Avisás el mismo día y después presentás el certificado médico.\u003c/p>\u003c/div>\n        \u003cdiv class=\"lic\">\u003cdiv class=\"lic-h\">\u003cb>Fallecimiento de familiar directo\u003c/b>\u003cspan>3 días\u003c/span>\u003c/div>\u003cp>Avisás el mismo día y después presentás el certificado de defunción.\u003c/p>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" data-sec=\"adelantos\" data-label=\"Adelantos\" hidden>\n  \u003ch2>Adelantos de sueldo\u003c/h2>\n  \u003cp class=\"lead\">Cuándo y cómo pedir un adelanto.\u003c/p>\n  \u003cdiv class=\"stack\">\n    \u003cdiv class=\"facts\">\n      \u003cdiv class=\"fact\">\u003cspan class=\"big\">10 al 25\u003c/span>\u003cspan>de cada mes se pueden pedir y otorgar\u003c/span>\u003c/div>\n      \u003cdiv class=\"fact\">\u003cspan class=\"big\">Martes\u003c/span>\u003cspan>es el día de pago\u003c/span>\u003c/div>\n      \u003cdiv class=\"fact\">\u003cspan class=\"big\">30%\u003c/span>\u003cspan>del sueldo como máximo, sumando todos los adelantos\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\n      \u003ch3>Cómo pedirlo\u003c/h3>\n      \u003col class=\"steps\">\n        \u003cli>\u003cb>Charlalo con tu encargado.\u003c/b> Avisale que necesitás un adelanto. Como se paga el martes, pedilo entre el miércoles y el lunes de la semana anterior.\u003c/li>\n        \u003cli>\u003cb>El encargado informa a RRHH.\u003c/b> Le manda un mail a Mariel con copia al gerente, con tu nombre y el monto. Necesita autorización previa.\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n    \u003cp class=\"note\">Si necesitás un adelanto fuera de estas reglas y el responsable del local cree que corresponde una excepción, lo consulta con RRHH.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" data-sec=\"presentismo\" data-label=\"Presentismo\" hidden>\n  \u003ch2>Presentismo\u003c/h2>\n  \u003cp class=\"lead\">Cuándo cobrás el presentismo del mes.\u003c/p>\n  \u003cdiv class=\"stack\">\n    \u003cdiv class=\"panel\">\n      \u003ch3>Lo cobrás si:\u003c/h3>\n      \u003cul class=\"checks\">\n        \u003cli>\u003cb>No tuviste ninguna ausencia en el mes,\u003c/b> ni justificada ni injustificada.\u003c/li>\n        \u003cli>\u003cb>No superaste 1 hora en total de llegadas tarde\u003c/b> en el mes.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003cp class=\"note\">Si estuviste con licencia por ART, \u003cstrong>sí\u003c/strong> te corresponde cobrarlo.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" data-sec=\"certificados\" data-label=\"Certificados\" hidden>\n  \u003ch2>Cómo presentar certificados\u003c/h2>\n  \u003cp class=\"lead\">Un certificado a tiempo evita un apercibimiento por falta injustificada.\u003c/p>\n  \u003cdiv class=\"stack\">\n    \u003cdiv class=\"panel\">\n      \u003col class=\"steps\">\n        \u003cli>\u003cb>Avisá el mismo día.\u003c/b> Si faltás por enfermedad, enfermedad de un familiar directo o fallecimiento, avisale a tu gerente ese mismo día.\u003c/li>\n        \u003cli>\u003cb>Conseguí el comprobante:\u003c/b> certificado médico, certificado de examen, constancia de transporte público o certificado de defunción, según el caso.\u003c/li>\n        \u003cli>\u003cb>Entregáselo a Mariel (RRHH)\u003c/b> en un plazo máximo de \u003cstrong>48 horas hábiles\u003c/strong>.\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n    \u003cp class=\"note\">Si no presentás el certificado, la falta cuenta como \u003cstrong>injustificada\u003c/strong>: corresponde un apercibimiento, que se firma al día siguiente. Recordá que cualquier ausencia, aunque sea justificada, hace que no cobres el presentismo de ese mes.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" data-sec=\"apercibimientos\" data-label=\"Apercibimientos\" hidden>\n  \u003ch2>Apercibimientos\u003c/h2>\n  \u003cp class=\"lead\">Tener reglas claras nos ayuda a trabajar mejor en equipo. Te contamos cuándo corresponde un apercibimiento, así no hay sorpresas.\u003c/p>\n  \u003cdiv class=\"stack\">\n    \u003cdiv class=\"cards\">\n      \u003cdiv class=\"lic\">\u003cdiv class=\"lic-h\">\u003cb>Llegada tarde\u003c/b>\u003cspan>Se firma el mismo día\u003c/span>\u003c/div>\u003cp>Si llegás más de 20 minutos después de tu horario.\u003c/p>\u003c/div>\n      \u003cdiv class=\"lic\">\u003cdiv class=\"lic-h\">\u003cb>Falta sin justificar\u003c/b>\u003cspan>Se firma al día siguiente\u003c/span>\u003c/div>\u003cp>Si faltás y no presentás certificado médico o de examen.\u003c/p>\u003c/div>\n      \u003cdiv class=\"lic\">\u003cdiv class=\"lic-h\">\u003cb>No respetar una norma\u003c/b>\u003cspan>Se firma el mismo día\u003c/span>\u003c/div>\u003cp>Si no se cumple alguna regla del reglamento interno.\u003c/p>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"prin p-teal\">\n      \u003ch3>Para que no te pase\u003c/h3>\n      \u003cul class=\"checks\">\n        \u003cli>\u003cb>Si te vas a demorar,\u003c/b> avisale a tu encargado lo antes posible.\u003c/li>\n        \u003cli>\u003cb>Si no podés venir,\u003c/b> avisá ese mismo día y presentá el certificado dentro de las 48 hs hábiles. Así la falta queda justificada.\u003c/li>\n        \u003cli>\u003cb>¿Tenés dudas sobre una regla?\u003c/b> Preguntale a tu encargado o a Mari.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\n      \u003ch3>Suspensiones\u003c/h3>\n      \u003cp>A partir del 3° apercibimiento, RRHH puede evaluar una suspensión, siempre según cada caso. Como referencia:\u003c/p>\n      \u003cul class=\"plain\">\n        \u003cli>\u003cb>Llegadas tarde:\u003c/b> 1 día cada 3 apercibimientos.\u003c/li>\n        \u003cli>\u003cb>Faltas sin justificar:\u003c/b> hasta 1 día por cada apercibimiento.\u003c/li>\n        \u003cli>\u003cb>Normas:\u003c/b> depende de lo que haya pasado.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003cp class=\"note\">El apercibimiento lo firman vos y tu encargado. Firmarlo significa que te enteraste. Si no estás de acuerdo, charlalo con Mari.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" data-sec=\"horas-extras\" data-label=\"Horas extras\" hidden>\n  \u003ch2>Horas extras\u003c/h2>\n  \u003cp class=\"lead\">Quién las aprueba y cómo se registran.\u003c/p>\n  \u003cdiv class=\"stack\">\n    \u003cdiv class=\"facts\">\n      \u003cdiv class=\"fact\">\u003cspan class=\"big\">Solo el gerente\u003c/span>\u003cspan>puede aprobar horas extras\u003c/span>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"panel\">\n      \u003cul class=\"plain\">\n        \u003cli>Las horas extras las aprueba \u003cb>únicamente tu gerente\u003c/b>. Ni el encargado ni otra persona pueden aprobarlas.\u003c/li>\n        \u003cli>Tus horas quedan registradas en la \u003cb>planilla de horas\u003c/b> del local, que revisa RRHH.\u003c/li>\n      \u003c/ul>\n    \u003c/div>\n    \u003cp class=\"note\">¿Tenés que quedarte fuera de horario? Consultalo con tu gerente.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" data-sec=\"beneficios\" data-label=\"Beneficios\" hidden>\n  \u003ch2>Beneficios\u003c/h2>\n  \u003cp class=\"lead\">Ser parte de Temple tiene sus ventajas. ¡Aprovechalas!\u003c/p>\n  \u003cdiv class=\"bens\">\n\n    \u003carticle class=\"ben b-teal\">\n      \u003cdiv class=\"ben-top\">\u003cspan class=\"ben-big\">20%\u003c/span>\u003cspan class=\"ben-tag\">off\u003c/span>\u003c/div>\n      \u003ch3>Salí con tu gente\u003c/h3>\n      \u003cp>Tenés \u003cb>20% de descuento\u003c/b> en Temple Monroe, Barrio Chino y Barrio Norte.\u003c/p>\n    \u003c/article>\n\n    \u003carticle class=\"ben b-pink\">\n      \u003cdiv class=\"ben-top\">\u003cspan class=\"ben-big\">10\u003c/span>\u003cspan class=\"ben-tag\">tragos\u003c/span>\u003c/div>\n      \u003ch3>¡Feliz cumple!\u003c/h3>\n      \u003cp>Te regalamos \u003cb>10 tragos\u003c/b> para festejar con quien quieras.\u003c/p>\n      \u003cp class=\"ben-how\">\u003cspan>Condiciones\u003c/span>El voucher se canjea \u003cb>solo en locales propios\u003c/b> de Temple.\u003c/p>\n      \u003cp class=\"ben-how\">\u003cspan>Cómo lo pido\u003c/span>Mandá un mail a Mari con 24 hs de anticipación, contando qué día y en qué local lo vas a usar.\u003cbr>Mail: \u003cspan class=\"sel\">mari.albajari@temple.com.ar\u003c/span>\u003c/p>\n    \u003c/article>\n\n    \u003carticle class=\"ben b-yellow\">\n      \u003cdiv class=\"ben-top\">\u003cspan class=\"ben-big\">1\u003c/span>\u003cspan class=\"ben-tag\">sueldo\u003c/span>\u003c/div>\n      \u003ch3>Una mano cuando la necesitás\u003c/h3>\n      \u003cp>Préstamo personal de \u003cb>hasta un sueldo neto\u003c/b>, que devolvés en hasta 6 cuotas. El interés va atado a la inflación oficial.\u003c/p>\n      \u003cp class=\"ben-how\">\u003cspan>Quiénes pueden\u003c/span>Si tenés 1 año o más en la empresa. Consultalo con Mari.\u003c/p>\n    \u003c/article>\n\n    \u003carticle class=\"ben b-slate\">\n      \u003cdiv class=\"ben-top\">\u003cspan class=\"ben-big\">15\u003c/span>\u003cspan class=\"ben-tag\">días\u003c/span>\u003c/div>\n      \u003ch3>Licencia por paternidad\u003c/h3>\n      \u003cp>Licencia por paternidad de \u003cb>15 días corridos, 100% paga\u003c/b>, desde el día del nacimiento.\u003c/p>\n      \u003cp class=\"ben-how\">\u003cspan>Qué hacés\u003c/span>Mandale a Mari el certificado de nacimiento junto con la solicitud de licencia.\u003c/p>\n    \u003c/article>\n\n    \u003carticle class=\"ben b-teal\">\n      \u003cdiv class=\"ben-top\">\u003cspan class=\"ben-big\">30%\u003c/span>\u003cspan class=\"ben-tag\">off\u003c/span>\u003c/div>\n      \u003ch3>A moverse\u003c/h3>\n      \u003cp>Tenés \u003cb>30% de descuento\u003c/b> en SportClub.\u003c/p>\n      \u003cp class=\"ben-how\">\u003cspan>Cómo lo uso\u003c/span>Con tu alta hecha, entrá a \u003ca href=\"https://www.sportclub.com.ar/corporativo/promocion-comercios-saludables-ec/\" target=\"_blank\" rel=\"noopener\">sportclub.com.ar\u003c/a>. ¿Todavía no tenés el alta? Pedísela a Mari.\u003c/p>\n    \u003c/article>\n\n    \u003carticle class=\"ben b-pink\">\n      \u003cdiv class=\"ben-top\">\u003cspan class=\"ben-big\">15%\u003c/span>\u003cspan class=\"ben-tag\">off\u003c/span>\u003c/div>\n      \u003ch3>Hello, English!\u003c/h3>\n      \u003cp>Descuento en \u003cb>todas las clases y niveles\u003c/b> de Total English.\u003c/p>\n      \u003cp class=\"ben-how\">\u003cspan>Cómo lo uso\u003c/span>Escribile a Laura y decile que sos de Temple. El descuento se aplica solo.\u003cbr>WhatsApp: \u003cspan class=\"sel\">+54 9 11 4969-6913\u003c/span>\u003cbr>Mail: \u003cspan class=\"sel\">totalenglishonline1@gmail.com\u003c/span>\u003c/p>\n    \u003c/article>\n\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" data-sec=\"herramientas\" data-label=\"Caja de herramientas\" hidden>\n  \u003ch2>Caja de herramientas\u003c/h2>\n  \u003cp class=\"lead\">Todos los formularios en un solo lugar. Tocá para abrirlos, descargarlos o imprimirlos.\u003c/p>\n  \u003cdiv class=\"stack\">\n    \u003cdiv>\n      \u003ch3 class=\"mb\">Ingreso\u003c/h3>\n      \u003cdiv class=\"tools\">\n        \u003ca class=\"tool\" href=\"https://drive.google.com/file/d/1e-as2KJKe7AxsYmCB0_tprm1AnBOf5O2/view\" target=\"_blank\" rel=\"noopener\">\u003cspan class=\"tool-name\">Legajo\u003c/span>\u003cspan class=\"tool-desc\">Datos personales del nuevo integrante.\u003c/span>\u003cspan class=\"tool-go\">Abrir PDF\u003c/span>\u003c/a>\n        \u003ca class=\"tool\" href=\"https://drive.google.com/file/d/1bZNDHqLl64KPQXjCCx8u6-OUohMbKMt4/view\" target=\"_blank\" rel=\"noopener\">\u003cspan class=\"tool-name\">Actualización de domicilio\u003c/span>\u003cspan class=\"tool-desc\">Al ingresar o cuando alguien se muda.\u003c/span>\u003cspan class=\"tool-go\">Abrir PDF\u003c/span>\u003c/a>\n        \u003ca class=\"tool\" href=\"https://docs.google.com/document/d/1Q2xq_8exbc0tG9UtG5BVWLzL9hxWAjOMvtAwec-dFxQ/export?format=pdf\" target=\"_blank\" rel=\"noopener\">\u003cspan class=\"tool-name\">Política de uniformes\u003c/span>\u003cspan class=\"tool-desc\">Se firma al entregar el uniforme.\u003c/span>\u003cspan class=\"tool-go\">Abrir PDF\u003c/span>\u003c/a>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv>\n      \u003ch3 class=\"mb\">Vacaciones y licencias\u003c/h3>\n      \u003cdiv class=\"tools\">\n        \u003ca class=\"tool\" href=\"https://drive.google.com/file/d/1xyJ9UZsSubJ_KouOMdYyXPuM4IBlOTVd/view\" target=\"_blank\" rel=\"noopener\">\u003cspan class=\"tool-name\">Solicitud de vacaciones\u003c/span>\u003cspan class=\"tool-desc\">Se completa después del OK del gerente.\u003c/span>\u003cspan class=\"tool-go\">Abrir PDF\u003c/span>\u003c/a>\n        \u003ca class=\"tool\" href=\"https://docs.google.com/document/d/1bv5uj4uzZOOj_GsC5nj_v6AHXkbkE2PfklquxKDBHvg/export?format=pdf\" target=\"_blank\" rel=\"noopener\">\u003cspan class=\"tool-name\">Solicitud de licencia\u003c/span>\u003cspan class=\"tool-desc\">Para cualquier tipo de licencia.\u003c/span>\u003cspan class=\"tool-go\">Abrir PDF\u003c/span>\u003c/a>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv>\n      \u003ch3 class=\"mb\">Apercibimientos\u003c/h3>\n      \u003cdiv class=\"tools\">\n        \u003ca class=\"tool\" href=\"https://docs.google.com/document/d/1apafdQcYGhxR1VEa2L_5aTD_ABoQe1U4HPrvGtxnyzM/export?format=pdf\" target=\"_blank\" rel=\"noopener\">\u003cspan class=\"tool-name\">Llegada tarde\u003c/span>\u003cspan class=\"tool-desc\">Más de 20 minutos tarde. Se firma el mismo día.\u003c/span>\u003cspan class=\"tool-go\">Abrir PDF\u003c/span>\u003c/a>\n        \u003ca class=\"tool\" href=\"https://docs.google.com/document/d/1oFQDCeF2LHTv3uRzxd7lhRHDEJQS_yv3nDFBoAvpoFA/export?format=pdf\" target=\"_blank\" rel=\"noopener\">\u003cspan class=\"tool-name\">Falta injustificada\u003c/span>\u003cspan class=\"tool-desc\">Falta sin certificado. Se firma al día siguiente.\u003c/span>\u003cspan class=\"tool-go\">Abrir PDF\u003c/span>\u003c/a>\n        \u003ca class=\"tool\" href=\"https://docs.google.com/document/d/1iahSTY2bOv6Ze1OBS3joYH1y9xMbNfzCzmiHYj-t6cU/export?format=pdf\" target=\"_blank\" rel=\"noopener\">\u003cspan class=\"tool-name\">Incumplimiento de normas\u003c/span>\u003cspan class=\"tool-desc\">Se firma el mismo día.\u003c/span>\u003cspan class=\"tool-go\">Abrir PDF\u003c/span>\u003c/a>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv>\n      \u003ch3 class=\"mb\">Cultura\u003c/h3>\n      \u003cdiv class=\"tools\">\n        \u003ca class=\"tool\" href=\"https://drive.google.com/file/d/1jVyFcTwMJkxSrUKgszhkl3qdNEwCp97n/view\" target=\"_blank\" rel=\"noopener\">\u003cspan class=\"tool-name\">Principios culturales 2026\u003c/span>\u003cspan class=\"tool-desc\">La presentación completa de la cultura Temple.\u003c/span>\u003cspan class=\"tool-go\">Abrir PDF\u003c/span>\u003c/a>\n      \u003c/div>\n    \u003c/div>\n    \u003cp class=\"note\">Estos son formularios en blanco. Los papeles ya completos y firmados se le entregan a Mari, no se suben a ningún lado.\u003c/p>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" data-sec=\"encargados\" data-label=\"Para encargados\" hidden>\n  \u003cspan class=\"enc-badge\">Solo para encargados\u003c/span>\n  \u003ch2>Guía para encargados\u003c/h2>\n  \u003cp class=\"lead\">Lo que tenés que hacer en cada situación del día a día.\u003c/p>\n  \u003cdiv class=\"stack\">\n    \u003cdiv class=\"prin p-teal\">\n      \u003ch3>Entra alguien nuevo\u003c/h3>\n      \u003col class=\"steps\" style=\"margin-top:12px\">\n        \u003cli>\u003cb>Pedile foto del DNI,\u003c/b> frente y dorso.\u003c/li>\n        \u003cli>\u003cb>Hacele completar y firmar\u003c/b> el legajo, la actualización de domicilio y la política de uniformes.\u003c/li>\n        \u003cli>\u003cb>Avisá a Mari por el grupo de WhatsApp\u003c/b> con: nombre y apellido, fecha de ingreso, puesto y foto del DNI.\u003c/li>\n        \u003cli>\u003cb>Entregale el uniforme.\u003c/b>\u003c/li>\n        \u003cli>\u003cb>Actualizá la planilla de horas\u003c/b> y avisale a Mari para que la revise.\u003c/li>\n        \u003cli>\u003cb>Pasale el link de esta app.\u003c/b>\u003c/li>\n      \u003c/ol>\n    \u003c/div>\n    \u003cdiv class=\"prin p-pink\">\n      \u003ch3>Alguien llega tarde, falta o no cumple una norma\u003c/h3>\n      \u003cdl>\n        \u003cdt>Llegada tarde\u003c/dt>\u003cdd>Con más de 20 minutos de demora, completá el apercibimiento y que se firme ese mismo día.\u003c/dd>\n        \u003cdt>Falta injustificada\u003c/dt>\u003cdd>Si faltó y no trajo certificado, el apercibimiento se firma al día siguiente.\u003c/dd>\n        \u003cdt>Incumplimiento de normas\u003c/dt>\u003cdd>Se firma el mismo día de la falta.\u003c/dd>\n        \u003cdt>Suspensiones\u003c/dt>\u003cdd>Las evalúa RRHH junto con vos. Si creés que corresponde una, charlalo con Mari.\u003c/dd>\n      \u003c/dl>\n      \u003cp class=\"muted\" style=\"margin-top:10px\">Firman el empleado y vos, como responsable que apercibe.\u003c/p>\n    \u003c/div>\n    \u003cdiv class=\"prin p-yellow\">\n      \u003ch3>Alguien pide un adelanto\u003c/h3>\n      \u003cdl>\n        \u003cdt>Cuándo\u003c/dt>\u003cdd>Solo entre el 10 y el 25 de cada mes. Se paga el martes, así que tiene que pedirlo entre el miércoles y el lunes anterior.\u003c/dd>\n        \u003cdt>Cuánto\u003c/dt>\u003cdd>La suma de adelantos no puede pasar el 30% del sueldo.\u003c/dd>\n        \u003cdt>Qué hacés\u003c/dt>\u003cdd>Mandale un mail a Mari con copia al gerente, con el nombre del empleado y el monto. Necesita autorización previa.\u003c/dd>\n        \u003cdt>Excepciones\u003c/dt>\u003cdd>Si creés que corresponde una excepción, consultalo con RRHH.\u003c/dd>\n      \u003c/dl>\n    \u003c/div>\n    \u003cdiv class=\"prin p-slate\">\n      \u003ch3>Vacaciones, licencias y horas extras\u003c/h3>\n      \u003cdl>\n        \u003cdt>Vacaciones y licencias\u003c/dt>\u003cdd>Primero lo charla con el gerente. Con el OK, completa la solicitud y se la entrega a Mari.\u003c/dd>\n        \u003cdt>Certificados\u003c/dt>\u003cdd>Recordale que tiene 48 horas hábiles para presentarlo a Mari.\u003c/dd>\n        \u003cdt>Horas extras\u003c/dt>\u003cdd>Solo las aprueba el gerente.\u003c/dd>\n      \u003c/dl>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003csection class=\"section\" data-sec=\"contacto\" data-label=\"Contacto\" hidden>\n  \u003ch2>Contacto RRHH\u003c/h2>\n  \u003cp class=\"lead\">¿Dudas? Escribinos.\u003c/p>\n  \u003cdiv class=\"stack\">\n    \u003cdiv class=\"panel contact\">\u003cb>Mariel\u003c/b>\u003cspan class=\"sel\">mari.albajari@temple.com.ar\u003c/span>\u003c/div>\n    \u003cdiv class=\"panel contact\">\u003cb>Mechi\u003c/b>\u003cspan class=\"sel\">mechi.stefanich@temple.com.ar\u003c/span>\u003c/div>\n    \u003cdiv class=\"panel contact\">\u003cb>Sol\u003c/b>\u003cspan class=\"sel\">sol.troncoso@temple.com.ar\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/section>\n";

        var p = document.createElement("p"); p.className = "muted";
        p.textContent = "No encontramos nada con esa palabra. Probá con otra o escribile a Mari.";
        results.appendChild(p); return;
      }
      var box = document.createElement("div"); box.className = "tiles";
      hits.forEach(function(i){
        var a = document.createElement("a"); a.className = "tile"; a.href = "#" + i.sec;
        var b = document.createElement("b"); b.textContent = i.label; a.appendChild(b);
        box.appendChild(a);
      });
      results.appendChild(box);
    });
    function route(scroll){
      var name = location.hash.slice(1);
      var target = secs.filter(function(s){ return s.getAttribute("data-sec") === name; })[0] || null;
      $("home").hidden = !!target;
      secs.forEach(function(s){ s.hidden = s !== target; });
      if (scroll) try { window.scrollTo(0, 0); } catch (e) {}
    }
    route(false);
    window.addEventListener("hashchange", function(){ route(true); });
  }

  show(CONTENT);
})();
</script>
</body></html>
